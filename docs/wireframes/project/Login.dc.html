<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;padding:10px 12px;font-size:12px;font-weight:600;color:#5C5C5C;border-bottom:1px solid #BDBDBD;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #E6E6E6;vertical-align:middle}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1A1A1A; background: #FFFFFF; min-height: 760px">
<main style="max-width: 440px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-size: 30px; font-weight: 600">Hourglass</h1>
<p style="margin: 0; font-size: 14px; color: #5C5C5C">Sign in to see your setups and tokens.</p>
<a href="Unauthorized.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 6px; font-size: 14px; text-decoration: none; background: #1D4ED8; color: #FFFFFF; border: 1px solid #1D4ED8">Sign in with SSO</a>
<div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #5C5C5C"><div style="flex: 1; border-top: 1px solid #BDBDBD"></div><span>Local administrator</span><div style="flex: 1; border-top: 1px solid #BDBDBD"></div></div>
<form style="display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="l-user" style="font-size: 13px; font-weight: 600">Username</label><input id="l-user" type="text" value="admin" style="min-height: 44px; padding: 0 12px; border: 1px solid #8A8A8A; border-radius: 6px; font: inherit; font-size: 14px; box-sizing: border-box; width: 100%"></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="l-pass" style="font-size: 13px; font-weight: 600">Password</label><input id="l-pass" type="password" style="min-height: 44px; padding: 0 12px; border: 1px solid #8A8A8A; border-radius: 6px; font: inherit; font-size: 14px; box-sizing: border-box; width: 100%"></div><button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; background: #FFFFFF; color: #1A1A1A; border: 1px solid #8A8A8A">Sign in as admin</button></form>
<p style="margin: 0; font-size: 12px; color: #5C5C5C">The local form is only for the built-in admin account. Everyone else uses SSO. First local sign-in forces a password change.</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return { tpl: '{' + '{.SetupName}}_RP' };
}
}
</script>
</body>
</html>
