# Override for the end-to-end test (e2e/run.sh), layered over
# deploy/compose.bundled.yaml: the test build of Hourglass with a clock the
# test can move, and its control port. Test only; never deploy this image.
services:
  hourglass:
    image: ${HOURGLASS_E2E_IMAGE:-hourglass-e2e:dev}
    environment:
      HOURGLASS_E2E_CONTROL: ":8091"
    ports:
      - "8091:8091"
