# SPDX-License-Identifier: MIT
# Sample seed file (SET-7): the reference scenario's setups and rate rules.
# Imported once, when the database has no setups; never applied again.
#
# The resource pools are named <setup>_RP; the provider's pool_name_suffix
# (config.sample.yaml) maps them to these setup names.
setups:
  - name: lab-01
    labels: {size: medium}
    details: {note: "sample setup", notes: "no real data"}
  - name: lab-02
    labels: {size: medium}
    details: {note: "sample setup"}
  - name: lab-03
    labels: {size: large}
    details: {note: "sample setup"}
  - name: lab-04
    labels: {size: large}
    details: {note: "sample setup"}
  - name: lab-05
    labels: {size: extralarge}
    details: {note: "sample setup"}
  - name: lab-06
    labels: {size: extralarge}
    details: {note: "sample setup"}

rate_rules:
  - {selector: "size=extralarge", weight: 4}
  - {selector: "size=large", weight: 2}

default_weight: 1
